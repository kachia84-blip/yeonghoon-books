<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영훈즈 서점</title>
<meta name="theme-color" content="#1c1b22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1c22;--sub:#6c6a75;--line:#ebe7e0;--accent:#e8613c;--shadow:0 2px 10px rgba(30,25,20,.08)}
:root[data-ui=dark]{--bg:#14131a;--card:#1f1e27;--ink:#efedf3;--sub:#9a98a5;--line:#2c2b36;--accent:#ff7a55;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;word-break:keep-all}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
.top h1 b{color:var(--accent)}
.top .sp{flex:1}
.top .btn{font-size:20px;padding:4px 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h2.sec{font-size:17px;font-weight:800;margin:24px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec small{font-size:12px;font-weight:500;color:var(--sub)}
.hero{margin:16px 0 4px;border-radius:18px;padding:20px;color:#fff;background:linear-gradient(135deg,#e8613c,#b5389a);box-shadow:var(--shadow)}
.hero .k{font-size:12px;opacity:.85}.hero .t{font-size:20px;font-weight:800;margin:4px 0 12px;line-height:1.3}
.hero .b{background:#fff;color:#b5389a;font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px}
.row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.book{flex:0 0 118px;scroll-snap-align:start;text-align:left}
.cover{aspect-ratio:2/3;border-radius:6px 10px 10px 6px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;box-shadow:var(--shadow),inset 5px 0 6px -3px rgba(0,0,0,.28)}
.cover .em{font-size:30px;line-height:1}.cover .tt{font-size:13px;font-weight:800;line-height:1.28;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.cover .cat{font-size:10px;opacity:.85;letter-spacing:.3px}
.cover .new{position:absolute;top:8px;right:8px;background:#fff;color:var(--accent);font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
.book .nm{font-size:13px;font-weight:700;margin:8px 0 2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .mt{font-size:11px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;margin-top:10px}
.grid .book{flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.cont{display:flex;gap:12px;align-items:center}.cont .cover{flex:0 0 56px;padding:6px;border-radius:4px 6px 6px 4px}.cont .cover .em{font-size:20px}.cont .cover .tt,.cont .cover .cat{display:none}
.cont .i{flex:1;min-width:0}.cont .i b{display:block;font-size:15px}.cont .i span{font-size:12px;color:var(--sub)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}.tab button span{font-size:20px}.tab button.on{color:var(--accent);font-weight:700}
.detail{display:flex;gap:16px;margin:18px 0}.detail .cover{flex:0 0 120px}.detail .tx h2{margin:0 0 4px;font-size:21px;line-height:1.25}.detail .tx p{margin:0 0 6px;color:var(--sub);font-size:14px}
.blurb{font-size:15px;line-height:1.65;color:var(--ink);margin:6px 0 14px}
.act{display:flex;gap:10px;margin:12px 0}.act button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card)}.act .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.toc{list-style:none;margin:0;padding:0}.toc li{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.toc .n{flex:0 0 28px;font-weight:800;color:var(--accent);font-size:14px}.toc .t{flex:1;font-size:15px;line-height:1.35}.toc .d{font-size:11px;color:var(--sub)}
.toc li.lock{opacity:.45;cursor:default}.toc li.read .t{color:var(--sub)}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:18px 0;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;line-height:1.7}
/* reader */
.reader{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.reader[data-th=light]{--rbg:#fffefb;--rink:#25232a;--rsub:#88858f}
.reader[data-th=sepia]{--rbg:#f3e9d4;--rink:#3b3023;--rsub:#8c7a62}
.reader[data-th=dark]{--rbg:#111015;--rink:#d9d6df;--rsub:#77747f}
.reader{background:var(--rbg);color:var(--rink)}
.rbar{position:sticky;top:0;background:var(--rbg);border-bottom:1px solid color-mix(in srgb,var(--rink) 12%,transparent);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:6px;z-index:2}
.rbar .ti{flex:1;text-align:center;font-size:13px;color:var(--rsub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar button{padding:6px 10px;font-size:15px;border-radius:8px;color:var(--rink)}
.rbody{max-width:640px;margin:0 auto;padding:26px 22px 60px}
.rbody .ch{font-size:12px;color:var(--rsub);letter-spacing:.5px}.rbody h1{font-size:1.45em;line-height:1.35;margin:6px 0 22px}
.rbody h3{font-size:1.15em;margin:2em 0 .6em;line-height:1.4}.rbody p{line-height:1.95;margin:0 0 1.15em;font-size:1em;white-space:pre-wrap}
.rnav{display:flex;gap:10px;margin-top:34px}.rnav button{flex:1;padding:14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--rink) 18%,transparent);font-weight:700;color:var(--rink)}.rnav .pri{background:var(--accent);border-color:var(--accent);color:#fff}
.rpg{position:fixed;left:0;top:0;height:3px;background:var(--accent);z-index:30;width:0}
.panel{position:fixed;right:10px;top:calc(56px + env(safe-area-inset-top));z-index:25;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);width:230px}
.panel div{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}.panel b{font-size:12px;color:var(--sub);font-weight:600}
.panel button{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}.panel .on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:50}
.inst{display:flex;gap:12px;align-items:center;margin:14px 0 0;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.inst .ic{width:44px;height:44px;border-radius:11px;flex:none}.inst .tx{flex:1;min-width:0}.inst b{display:block;font-size:14px}.inst span{font-size:12px;color:var(--sub)}
.inst .go{background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;font-size:13px;flex:none}.inst .x{color:var(--sub);font-size:18px;padding:4px;flex:none}
.search{width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.pick{display:flex;gap:14px;align-items:center;margin-top:10px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}
.pick .cover{flex:0 0 84px}.pick .i{flex:1;min-width:0}.pick .why{font-size:11px;color:var(--accent);font-weight:700}.pick h3{margin:3px 0 4px;font-size:16px;line-height:1.3}.pick p{margin:0;font-size:12px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why2{font-size:11px;color:var(--accent);margin-top:2px}
.nw{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px;font-size:18px}.modal ol{margin:0 0 16px;padding-left:20px;line-height:1.9;font-size:15px}.modal button{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.fresh{font-size:11px;color:var(--sub);text-align:center;margin:26px 0 8px}
</style>
</head>

  if (pk) h += `<h2 class="sec">오늘의 추천 한 권</h2><div class="pick" onclick="go('#/book/${pk.id}')">${coverHtml(pk.b)}<div class="i"><div class="why">${esc(pk.why)}</div><h3>${esc(pk.b.title)}</h3><p>${esc(pk.b.blurb)}</p></div></div>`;
  if (rc.length) h += `<h2 class="sec">${reading.length ? "취향 맞춤 추천" : "이런 책은 어때요"}</h2><div class="row">${rc.map(r => `<div>${bookCard(r.b)}<div class="why2" style="max-width:118px">${esc(r.why)}</div></div>`).join("")}</div>`;
  if (fresh.length) h += `<h2 class="sec">오늘 올라온 새 챕터 <small>${DATA.today}</small></h2><div class="row">${fresh.map(b => bookCard(b, "NEW")).join("")}</div>`;
  for (const c of DATA.categories){
    const bs = BOOKS.filter(b => b.category === c.id);
    if (!bs.length) continue;
    h += `<h2 class="sec"><span>${c.icon} ${esc(c.name)}</span><small onclick="go('#/shelf/${c.id}')" style="cursor:pointer">전체 보기 ›</small></h2><div class="row">${bs.map(b => bookCard(b, isToday(b.latest) ? "NEW" : "")).join("")}</div>`;
  }
  h += `<div class="fresh">마지막 갱신 ${DATA.generated_text} · 매일 새 챕터가 업데이트됩니다</div></div>`;
  $("#app").innerHTML = h;
}
function shelfGrid(cid, q){
  q = (q || "").trim().toLowerCase();
  const list = BOOKS.filter(b => (!cid || b.category === cid) && (!q || (b.title + " " + b.subtitle + " " + b.blurb + " " + b.toc.join(" ")).toLowerCase().includes(q)));
  return list.length ? `<div class="grid">${list.map(b => bookCard(b, isToday(b.latest) ? "NEW" : "")).join("")}</div>` : `<div class="empty">${q ? "검색 결과가 없어요" : "아직 책이 없어요"}</div>`;
}
function viewShelf(cid){
  setTab("shelf");
  let h = topbar() + `<div class="wrap"><input class="search" id="q" type="search" placeholder="제목·내용으로 책 검색" oninput="$('#grid').innerHTML = shelfGrid(${cid ? `'${cid}'` : "null"}, this.value)"><div class="chips"><button class="chip ${!cid?"on":""}" onclick="go('#/shelf')">전체</button>${DATA.categories.map(c => `<button class="chip ${cid===c.id?"on":""}" onclick="go('#/shelf/${c.id}')">${c.icon} ${esc(c.name)}</button>`).join("")}</div>`;
  $("#app").innerHTML = h + `<div id="grid">${shelfGrid(cid, "")}</div></div>`;
}
function viewMine(){
  setTab("mine");
  const reading = Object.entries(prog).map(([id,p]) => [BOOKS.find(b => b.id === id), p]).filter(([b]) => b).sort((a,b) => (b[1].t||0)-(a[1].t||0));
  const fb = favs.map(id => BOOKS.find(b => b.id === id)).filter(Boolean);
  let h = topbar() + `<div class="wrap">${installCard(true)}<h2 class="sec">읽고 있는 책</h2>`;
  h += reading.length ? reading.map(([b,p]) => `<div class="card cont" onclick="go('#/read/${b.id}/${Math.min(p.n,b.chapters)}')">${coverHtml(b)}<div class="i"><b>${esc(b.title)}</b><span>${p.n}화까지 · ${ago(p.t)}</span><div class="bar"><i style="width:${Math.round((p.read||[]).length/b.total*100)}%"></i></div></div></div>`).join("") : `<div class="empty">아직 읽은 책이 없어요.<br>홈에서 책을 골라 첫 화를 읽어 보세요.</div>`;
  h += `<h2 class="sec">찜한 책</h2>`;
  h += fb.length ? `<div class="grid">${fb.map(b => bookCard(b)).join("")}</div>` : `<div class="empty">책 상세 화면의 ♡ 버튼으로 찜해 두세요</div>`;
  $("#app").innerHTML = h + `</div>`;
}
function viewBook(id){
  setTab("shelf");
  const b = BOOKS.find(x => x.id === id); if (!b) return go("#/home");
  const c = CATS[b.category], p = prog[id] || {read: []}, fav = favs.includes(id);
  const next = p.n ? Math.min(p.n, b.chapters) : 1;
  let h = topbar(`<button class="btn" onclick="history.back()">‹</button>`) + `<div class="wrap"><div class="detail">${coverHtml(b)}<div class="tx"><h2>${esc(b.title)}</h2><p>${esc(b.subtitle)}</p><p>${c.icon} ${esc(c.name)} · ${b.chapters}/${b.total}화${b.done?" 완결":" 연재 중"}</p></div></div>`;
  h += `<div class="blurb">${esc(b.blurb)}</div><div class="act"><button class="pri" onclick="go('#/read/${id}/${next}')">${p.n ? `${next}화 이어 읽기` : "첫 화 읽기"}</button><button onclick="toggleFav('${id}')">${fav?"♥ 찜함":"♡ 찜하기"}</button></div>`;
  h += `<h2 class="sec">목차 <small>${b.done ? "전편 공개" : "매일 새 화가 공개돼요"}</small></h2><ul class="toc">`;
  b.toc.forEach((t, i) => {
    const n = i + 1, open = n <= b.chapters, rd = (p.read||[]).includes(n);
    h += `<li class="${open ? (rd?"read":"") : "lock"}" ${open ? `onclick="go('#/read/${id}/${n}')"` : ""}><span class="n">${n}</span><span class="t">${esc(t)}</span><span class="d">${open ? (b.dates[i]===DATA.today ? "NEW" : rd ? "읽음" : "") : "🔒 곧 공개"}</span></li>`;
  });
  h += `</ul>${c.caution ? `<div class="note">ℹ️ ${esc(c.notice || c.caution)}</div>` : ""}</div>`;
  $("#app").innerHTML = h; window.scrollTo(0, 0);
}
function toggleFav(id){ favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id]; store.set("favs", favs); viewBook(id); }

async function loadBook(id){
  if (cache[id]) return cache[id];
  const r = await fetch(`data/${id}.json?v=${DATA.generated}`); if (!r.ok) throw new Error("load");
  return cache[id] = await r.json();
}
async function viewRead(id, n){
  const b = BOOKS.find(x => x.id === id); if (!b || n < 1 || n > b.chapters) return go("#/book/" + id);
  let rd = document.querySelector(".reader");
  if (!rd){ rd = document.createElement("div"); rd.className = "reader"; document.body.appendChild(rd); }
  rd.dataset.th = pref.th;
  rd.innerHTML = `<div class="rbar"><button onclick="closeReader()">‹</button><div class="ti">${esc(b.title)}</div><button onclick="togglePanel()">Aa</button></div><div class="rbody" style="font-size:${pref.size}px"><div class="empty">불러오는 중…</div></div>`;
  let full; try{ full = await loadBook(id); }catch(e){ rd.querySelector(".rbody").innerHTML = `<div class="empty">책을 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.</div>`; return; }
  const ch = full.chapters[n - 1];
  const html = ch.body.split(/\n{2,}/).map(par => par.startsWith("## ") ? `<h3>${esc(par.slice(3).trim())}</h3>` : `<p>${esc(par.trim())}</p>`).join("");
  rd.innerHTML = `<div class="rpg" id="rpg"></div><div class="rbar"><button onclick="closeReader()">‹</button><div class="ti">${esc(b.title)} · ${n}화</div><button onclick="togglePanel()">Aa</button></div><div class="rbody" style="font-size:${pref.size}px"><div class="ch">${n}화 / ${b.total}화</div><h1>${esc(ch.title)}</h1>${html}<div class="rnav">${n>1?`<button onclick="go('#/read/${id}/${n-1}')">‹ 이전 화</button>`:""}${n<b.chapters?`<button class="pri" onclick="go('#/read/${id}/${n+1}')">다음 화 ›</button>`:`<button class="pri" onclick="closeReader()">${b.done?"완독! 책으로 돌아가기":"오늘 분량 끝 · 내일 다음 화가 와요"}</button>`}</div></div>`;
  rd.scrollTop = 0;
  const p = prog[id] || {read: []}; p.n = n; p.t = Date.now()/1000; p.read = [...new Set([...(p.read||[]), n])]; prog[id] = p; store.set("prog", prog);
  rd.onscroll = () => { $("#rpg").style.width = (rd.scrollTop / Math.max(1, rd.scrollHeight - rd.clientHeight) * 100) + "%"; };
}
function closeReader(){ const rd = document.querySelector(".reader"); if (rd) rd.remove(); const pn = document.querySelector(".panel"); if (pn) pn.remove(); if (location.hash.startsWith("#/read/")) history.back(); }
function togglePanel(){
  const old = document.querySelector(".panel"); if (old) return old.remove();
  const pn = document.createElement("div"); pn.className = "panel";
  const draw = () => pn.innerHTML = `<div><b>글자 크기</b><span><button onclick="setSize(-1)">A-</button> <button onclick="setSize(1)">A+</button></span></div><div><b>배경</b><span>${[["light","흰색"],["sepia","종이"],["dark","어둡게"]].map(([k,n]) => `<button class="${pref.th===k?"on":""}" onclick="setTh('${k}')">${n}</button>`).join(" ")}</span></div>`;
  pn._draw = draw; draw(); document.body.appendChild(pn);
}
function setSize(d){ pref.size = Math.max(14, Math.min(28, pref.size + d * 2)); store.set("pref", pref); const r = document.querySelector(".rbody"); if (r) r.style.fontSize = pref.size + "px"; }
function setTh(k){ pref.th = k; store.set("pref", pref); const rd = document.querySelector(".reader"); if (rd) rd.dataset.th = k; const pn = document.querySelector(".panel"); if (pn) pn._draw(); }

/* ---- 앱 설치 ---- */
let deferredPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true || new URLSearchParams(location.search).get("standalone") === "1";
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (!location.hash || location.hash.startsWith("#/home")) route(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; store.set("noinst", true); toast("설치됐어요! 홈 화면에서 열어 보세요"); route(); });
function installCard(force){
  if (isStandalone() || (!force && store.get("noinst", false))) return "";
  const label = deferredPrompt ? "설치" : "방법 보기";
  return `<div class="inst"><img class="ic" src="icon-180.png" alt=""><div class="tx"><b>영훈즈 서점 앱으로 설치</b><span>홈 화면에서 바로 열고, 이어 읽기도 한 번에</span></div><button class="go" onclick="installApp()">${label}</button><button class="x" aria-label="닫기" onclick="store.set('noinst',true);route()">✕</button></div>`;
}
async function installApp(){
  if (deferredPrompt){
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(e){}
    deferredPrompt = null; route(); return;
  }
  const steps = isIos()
    ? ["Safari 하단의 <b>공유 버튼(□↑)</b>을 누르세요", "<b>‘홈 화면에 추가’</b>를 고르세요", "오른쪽 위 <b>‘추가’</b>를 누르면 끝!"]
    : ["브라우저(Chrome) 오른쪽 위 <b>⋮ 메뉴</b>를 누르세요", "<b>‘앱 설치’</b> 또는 <b>‘홈 화면에 추가’</b>를 고르세요", "<b>‘설치’</b>를 누르면 끝!"];
  const m = document.createElement("div"); m.className = "modal"; m.onclick = e => { if (e.target === m) m.remove(); };
  m.innerHTML = `<div class="sheet"><h3>📲 앱으로 설치하기</h3><ol>${steps.map(s => `<li>${s}</li>`).join("")}</ol><button onclick="this.closest('.modal').remove()">확인</button></div>`;
  document.body.appendChild(m);
}
function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ---- 추천 ---- */
const seed = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
function catWeights(){
  const w = {};
  for (const [id, p] of Object.entries(prog)){ const b = BOOKS.find(x => x.id === id); if (b) w[b.category] = (w[b.category] || 0) + (p.read || []).length; }
  for (const id of favs){ const b = BOOKS.find(x => x.id === id); if (b) w[b.category] = (w[b.category] || 0) + 4; }
  return w;
}
function todayPick(){
  const pool = BOOKS.filter(b => !(prog[b.id] && (prog[b.id].read || []).length));
  if (!pool.length) return null;
  const b = pool.map(x => [seed(DATA.today + x.id), x]).sort((a, c) => a[0] - c[0])[0][1];
  return {id: b.id, b, why: `${CATS[b.category].icon} ${CATS[b.category].name} · 오늘 이 책부터 시작해 보세요`};
}
function recommend(){
  const w = catWeights(), top = Object.entries(w).sort((a, b) => b[1] - a[1]);
  const pk = todayPick();
  const cands = BOOKS.filter(b => !(prog[b.id] && (prog[b.id].read || []).length) && !(pk && pk.id === b.id));
  const scored = cands.map(b => {
    let s = seed(DATA.today + "r" + b.id) * 0.8, why = "새로 시작하기 좋은 책";
    if (w[b.category]){ s += 2 + Math.min(3, w[b.category] / 3); why = `${CATS[b.category].name}을(를) 자주 읽어서`; }
    if (b.chapters <= 3) { s += 0.6; if (!w[b.category]) why = "연재를 막 시작했어요"; }
    if (!b.done && b.total - b.chapters <= 3 && b.chapters > 3) { s += 0.4; why = "곧 완결돼요"; }
    return {b, s, why};
  }).sort((a, b) => b.s - a.s);
  return scored.slice(0, 6);
}

function go(h){ if (location.hash === h) route(); else location.hash = h; }
function route(){
  const parts = (location.hash || "#/home").slice(2).split("/");
  const reading = parts[0] === "read";
  if (!reading){ const rd = document.querySelector(".reader"); if (rd) rd.remove(); const pn = document.querySelector(".panel"); if (pn) pn.remove(); }
  if (parts[0] === "read") return viewRead(parts[1], +parts[2]);
  if (parts[0] === "book") return viewBook(parts[1]);
  if (parts[0] === "shelf") return viewShelf(parts[1]);
  if (parts[0] === "mine") return viewMine();
  viewHome();
}
window.addEventListener("hashchange", route);
applyUi(); route();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
