<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영훈즈 서점</title>
<meta name="theme-color" content="#1c1b22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1c22;--sub:#6c6a75;--line:#ebe7e0;--accent:#e8613c;--shadow:0 2px 10px rgba(30,25,20,.08)}
:root[data-ui=dark]{--bg:#14131a;--card:#1f1e27;--ink:#efedf3;--sub:#9a98a5;--line:#2c2b36;--accent:#ff7a55;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;word-break:keep-all}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
.top h1 b{color:var(--accent)}
.top .sp{flex:1}
.top .btn{font-size:20px;padding:4px 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h2.sec{font-size:17px;font-weight:800;margin:24px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec small{font-size:12px;font-weight:500;color:var(--sub)}
.hero{margin:16px 0 4px;border-radius:18px;padding:20px;color:#fff;background:linear-gradient(135deg,#e8613c,#b5389a);box-shadow:var(--shadow)}
.hero .k{font-size:12px;opacity:.85}.hero .t{font-size:20px;font-weight:800;margin:4px 0 12px;line-height:1.3}
.hero .b{background:#fff;color:#b5389a;font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px}
.row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.book{flex:0 0 118px;scroll-snap-align:start;text-align:left}
.cover{aspect-ratio:2/3;border-radius:6px 10px 10px 6px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;box-shadow:var(--shadow),inset 5px 0 6px -3px rgba(0,0,0,.28)}
.cover .em{font-size:30px;line-height:1}.cover .tt{font-size:13px;font-weight:800;line-height:1.28;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.cover .cat{font-size:10px;opacity:.85;letter-spacing:.3px}
.cover .new{position:absolute;top:8px;right:8px;background:#fff;color:var(--accent);font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
.book .nm{font-size:13px;font-weight:700;margin:8px 0 2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .mt{font-size:11px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;margin-top:10px}
.grid .book{flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.cont{display:flex;gap:12px;align-items:center}.cont .cover{flex:0 0 56px;padding:6px;border-radius:4px 6px 6px 4px}.cont .cover .em{font-size:20px}.cont .cover .tt,.cont .cover .cat{display:none}
.cont .i{flex:1;min-width:0}.cont .i b{display:block;font-size:15px}.cont .i span{font-size:12px;color:var(--sub)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}.tab button span{font-size:20px}.tab button.on{color:var(--accent);font-weight:700}
.detail{display:flex;gap:16px;margin:18px 0}.detail .cover{flex:0 0 120px}.detail .tx h2{margin:0 0 4px;font-size:21px;line-height:1.25}.detail .tx p{margin:0 0 6px;color:var(--sub);font-size:14px}
.blurb{font-size:15px;line-height:1.65;color:var(--ink);margin:6px 0 14px}
.act{display:flex;gap:10px;margin:12px 0}.act button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card)}.act .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.toc{list-style:none;margin:0;padding:0}.toc li{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.toc .n{flex:0 0 28px;font-weight:800;color:var(--accent);font-size:14px}.toc .t{flex:1;font-size:15px;line-height:1.35}.toc .d{font-size:11px;color:var(--sub)}
.toc li.lock{opacity:.45;cursor:default}.toc li.read .t{color:var(--sub)}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:18px 0;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;line-height:1.7}
/* reader */
.reader{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.reader[data-th=light]{--rbg:#fffefb;--rink:#25232a;--rsub:#88858f}
.reader[data-th=sepia]{--rbg:#f3e9d4;--rink:#3b3023;--rsub:#8c7a62}
.reader[data-th=dark]{--rbg:#111015;--rink:#d9d6df;--rsub:#77747f}
.reader{background:var(--rbg);color:var(--rink)}
.rbar{position:sticky;top:0;background:var(--rbg);border-bottom:1px solid color-mix(in srgb,var(--rink) 12%,transparent);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:6px;z-index:2}
.rbar .ti{flex:1;text-align:center;font-size:13px;color:var(--rsub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar button{padding:6px 10px;font-size:15px;border-radius:8px;color:var(--rink)}
.rbody{max-width:640px;margin:0 auto;padding:26px 22px 60px}
.rbody .ch{font-size:12px;color:var(--rsub);letter-spacing:.5px}.rbody h1{font-size:1.45em;line-height:1.35;margin:6px 0 22px}
.rbody h3{font-size:1.15em;margin:2em 0 .6em;line-height:1.4}.rbody p{line-height:1.95;margin:0 0 1.15em;font-size:1em;white-space:pre-wrap}
.rnav{display:flex;gap:10px;margin-top:34px}.rnav button{flex:1;padding:14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--rink) 18%,transparent);font-weight:700;color:var(--rink)}.rnav .pri{background:var(--accent);border-color:var(--accent);color:#fff}
.rpg{position:fixed;left:0;top:0;height:3px;background:var(--accent);z-index:30;width:0}
.panel{position:fixed;right:10px;top:calc(56px + env(safe-area-inset-top));z-index:25;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);width:230px}
.panel div{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}.panel b{font-size:12px;color:var(--sub);font-weight:600}
.panel button{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}.panel .on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:50}
.inst{display:flex;gap:12px;align-items:center;margin:14px 0 0;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.inst .ic{width:44px;height:44px;border-radius:11px;flex:none}.inst .tx{flex:1;min-width:0}.inst b{display:block;font-size:14px}.inst span{font-size:12px;color:var(--sub)}
.inst .go{background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;font-size:13px;flex:none}.inst .x{color:var(--sub);font-size:18px;padding:4px;flex:none}
.search{width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.pick{display:flex;gap:14px;align-items:center;margin-top:10px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}
.pick .cover{flex:0 0 84px}.pick .i{flex:1;min-width:0}.pick .why{font-size:11px;color:var(--accent);font-weight:700}.pick h3{margin:3px 0 4px;font-size:16px;line-height:1.3}.pick p{margin:0;font-size:12px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why2{font-size:11px;color:var(--accent);margin-top:2px}
.nw{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px;font-size:18px}.modal ol{margin:0 0 16px;padding-left:20px;line-height:1.9;font-size:15px}.modal button{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
:root[data-ui=dark]{--bg:#141414;--card:#1f1f1f;--line:#2b2b2b;--accent:#e5484d;--sub:#a3a3a3}
.top.nf{position:fixed;left:0;right:0;border:0;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff}
.top.nf h1{color:#fff}.top.nf h1 b{color:#e5484d}
.nhero{position:relative;margin:0 -16px;height:min(74vh,600px);min-height:440px;overflow:hidden;color:#fff;cursor:pointer}
.nhero .bgc{position:absolute;inset:0;transition:opacity .5s}
.nhero .big{position:absolute;right:-10px;top:12%;font-size:210px;line-height:1;opacity:.92;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
.nhero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,var(--bg) 96%)}
.nhero .ct{position:absolute;left:16px;right:16px;bottom:22px}
.nhero .tag{font-size:12px;font-weight:700;letter-spacing:.3px;opacity:.95}
.nhero h2{margin:6px 0 8px;font-size:32px;line-height:1.15;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.nhero p{margin:0 0 14px;font-size:14px;line-height:1.55;opacity:.92;max-width:34em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nhero .bt{display:flex;gap:10px}.nhero .bt button{padding:11px 22px;border-radius:8px;font-weight:800;font-size:15px}
.nhero .bt .w{background:#fff;color:#111}.nhero .bt .g{background:rgba(109,109,110,.7);color:#fff}
.nhero .dots{position:absolute;right:16px;top:calc(70px + env(safe-area-inset-top));display:flex;gap:6px}.nhero .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}.nhero .dots i.on{background:#fff}
.rank{flex:0 0 150px;display:flex;align-items:flex-end;scroll-snap-align:start;cursor:pointer}
.rank .num{font-size:104px;font-weight:900;line-height:.78;color:var(--bg);-webkit-text-stroke:3px #6b6b6b;margin-right:-20px;position:relative;z-index:1;letter-spacing:-8px}
.rank .cover{width:104px;flex:none}
.nfwrap h2.sec{font-size:18px;margin:22px 0 10px}
.rate{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.rate b{flex:1 1 100%;font-size:14px}.rate small{flex:1 1 100%;font-size:11px;color:var(--sub);margin-top:-4px}
.rate button{flex:1;padding:10px 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:14px}.rate button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.reader .rate{background:transparent;border-color:color-mix(in srgb,var(--rink) 18%,transparent);margin-top:30px}.reader .rate button{color:var(--rink);border-color:color-mix(in srgb,var(--rink) 22%,transparent)}.reader .rate button.on{color:#fff}
.disc{font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.wish{display:flex;gap:12px;align-items:center;margin:14px 0 0;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(229,72,77,.16),rgba(181,56,154,.14));border:1px solid var(--line);cursor:pointer}
.wish .em{font-size:30px}.wish b{display:block;font-size:15px}.wish span{font-size:12px;color:var(--sub)}.wish .go{margin-left:auto;font-weight:800;color:var(--accent);font-size:13px;white-space:nowrap}
.wf label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 6px}.wf textarea,.wf select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}.wf textarea{min-height:96px;resize:vertical}
.wf .cnt{text-align:right;font-size:11px;color:var(--sub);margin-top:4px}.wf .row2{display:flex;gap:10px}.wf .row2>div{flex:1}
.modal .sheet .sec2{display:flex;gap:10px;margin-top:14px}.modal .sheet .sec2 button{flex:1}.modal .sheet .sec2 .sub{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.rq{display:flex;gap:10px;align-items:flex-start;padding:12px;margin:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.rq .st{flex:none;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;color:#fff;background:#777}.rq .st.q{background:#8a8a8a}.rq .st.w{background:#d9822b}.rq .st.d{background:#2f9e6e}.rq .st.x{background:#a33}
.rq .tx{flex:1;min-width:0}.rq .tx b{display:block;font-size:14px;line-height:1.4;word-break:break-all}.rq .tx span{font-size:12px;color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 4px}
.tile{border-radius:14px;padding:14px;color:#fff;text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tile .ti{position:absolute;right:10px;top:8px;font-size:34px;opacity:.9}.tile b{font-size:16px;font-weight:800}.tile small{font-size:11px;opacity:.85}
.crumb{display:flex;align-items:center;gap:10px;margin:14px 0 4px}.crumb button{font-size:13px;color:var(--sub);padding:6px 10px;border:1px solid var(--line);border-radius:999px}.crumb b{font-size:17px}.crumb span{font-size:12px;color:var(--sub)}
.ctl{display:flex;gap:8px;margin:14px 0 0}.ctl select{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.fresh{font-size:11px;color:var(--sub);text-align:center;margin:26px 0 8px}
</style>
</head>

    let s = seed(DATA.today + "r" + b.id) * 0.8, why = "새로 시작하기 좋은 책";

    if (w[b.category] > 0){ s += 2 + Math.min(3, w[b.category] / 3); why = `${CATS[b.category].name}을(를) 자주 읽어서`; }

        const angle = seed(base + ":angle:" + n) * Math.PI * 2;
        const radius = 12 + seed(base + ":radius:" + n) * 54;
        return [cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius];
      });
      const complete = Number(b.total) > 0 && read.length >= Number(b.total);
      const group = svgNode("g", {});
      const title = svgNode("title", {});
      title.textContent = `${b.title}: ${read.length}/${b.total}화${complete ? " 완독" : ""}`;
      group.append(title);
      if (complete) {
        group.append(svgNode("polyline", {
          points: points.map(p => p.join(",")).join(" "),
          fill: "none", stroke: color(CATS[b.category]?.color),
          "stroke-width": 2, "stroke-opacity": .8
        }));
      }
      points.forEach(([x, y], i) => {
        const star = svgNode("circle", {
          cx: x, cy: y, r: 2 + seed(base + ":size:" + read[i]) * 1.5,
          fill: "#fff4d5", class: "fx-star"
        });
        star.style.animationDelay = `${-seed(base + ":" + read[i]) * 5}s`;
        group.append(star);
      });
      if (complete) {
        const label = svgNode("text", {
          x: cx, y: cy + 76, fill: "#eee9ff", "font-size": 18, "text-anchor": "middle"
        });
        label.textContent = String(b.title).length > 14 ? String(b.title).slice(0, 13) + "…" : b.title;
        group.append(label);
      }
      svg.append(group);
    });
    node.append(svg, el("p", "fx-description", "읽은 화마다 별 하나 · 완독하면 별들이 이어져요."));
  }

  function clearAccent() {
    if (accentOwner?.style.getPropertyValue("--accent") === appliedAccent) {
      if (previousAccent) accentOwner.style.setProperty("--accent", previousAccent, previousPriority);
      else accentOwner.style.removeProperty("--accent");
    }
    accentOwner = null;
  }

  function setAccent(mood) {
    if (!accentOwner) {
      accentOwner = document.documentElement;
      previousAccent = accentOwner.style.getPropertyValue("--accent");
      previousPriority = accentOwner.style.getPropertyPriority("--accent");
    }
    accentOwner.style.removeProperty("--accent");
    const base = previousAccent || getComputedStyle(accentOwner).getPropertyValue("--accent").trim();
    appliedAccent = CSS.supports("color", "color-mix(in srgb, red, blue)")
      ? `color-mix(in srgb, ${base} 75%, ${mood.color} 25%)` : mood.color;
    accentOwner.style.setProperty("--accent", appliedAccent);
  }

  function dailyMood() {
    const saved = store.get(MOOD_KEY, null);
    return saved?.day === today() ? moods.find(m => m.id === saved.id) : null;
  }

  function renderMood(wrap) {
    const node = section(wrap, `${PREFIX}-mood`, "오늘의 기분 다이얼");
    const hero = wrap.querySelector("#hero") || wrap.querySelector(".nhero,.hero");
    if (hero) hero.after(node);
    else wrap.prepend(node);
    const selected = dailyMood();
    if (selected) setAccent(selected);
    else clearAccent();
    const chips = el("div", "fx-moods");
    chips.setAttribute("role", "group");
    chips.setAttribute("aria-label", "오늘의 기분 선택");
    moods.forEach(m => {
      const chip = button(m.name, () => {
        store.set(MOOD_KEY, { day: today(), id: selected?.id === m.id ? null : m.id });
        renderMood(wrap);
      });
      chip.style.setProperty("--fx-mood", m.color);
      chip.setAttribute("aria-pressed", String(selected?.id === m.id));
      chips.append(chip);
    });
    node.append(chips);
    const results = el("div");
    results.setAttribute("aria-live", "polite");
    if (!selected) {
      results.append(el("p", "fx-description", "오늘 마음에 맞는 기분을 골라 보세요."));
    } else {
      results.append(el("h3", "fx-heading", "오늘의 기분 맞춤"));
      const row = el("div", "fx-row");
      const score = b => {
        const category = CATS[b.category]?.name || "";
        return (selected.re.test(category) ? 20 : 0) +
          (selected.re.test(`${b.title} ${b.subtitle} ${b.blurb}`) ? 3 : 0) +
          (selected.id === "light" ? 2 / Math.max(1, Number(b.total)) : 0) +
          seed(today() + selected.id + b.id);
      };
      const books = BOOKS.filter(b => rateOf(b.id) >= 0)
        .map(b => ({ b, score: score(b) })).sort((a, b) => b.score - a.score).slice(0, 8);
      books.forEach(({ b }) => {
        const card = button(`${b.title} 상세 보기`, () => bookLink(b));
        card.className = "fx-book";
        card.replaceChildren();
        const cover = el("span", "fx-cover");
        cover.style.background = `linear-gradient(150deg,${color(CATS[b.category]?.color)},hsl(${hue(String(b.id))} 45% 25%))`;
        cover.append(el("span", "fx-emoji", b.emoji || "📚"), el("span", "fx-cover-title", b.title));
        card.append(cover, el("span", "fx-book-name", b.title));
        row.append(card);
      });
      results.append(books.length ? row : el("p", "fx-description", "지금 추천할 책이 없어요."));
    }
    node.append(results);
    clearTimeout(expiryTimer);
    const midnight = new Date();
    midnight.setHours(24, 0, 0, 100);
    expiryTimer = setTimeout(safe(() => {
      clearAccent();
      if (node.isConnected) renderMood(wrap);
    }), Math.max(100, midnight.getTime() - Date.now()));
  }

  function spectrum(wrap) {
    const node = section(wrap, `${PREFIX}-spectrum`, "나의 취향 스펙트럼");
    const stats = Object.entries(CATS).map(([id, cat]) => ({ id, cat, read: 0, score: 0 }));
    const lookup = new Map(stats.map(s => [s.id, s]));
    BOOKS.forEach(b => {
      const s = lookup.get(String(b.category));
      if (!s) return;
      const count = readChapters(b).length;
      s.read += count;
      s.score += count + Math.sign(Number(rateOf(b.id)) || 0) * 6;
    });
    const total = stats.reduce((sum, s) => sum + Math.max(0, s.score), 0);
    const stack = el("div", "fx-stack");
    stack.setAttribute("role", "img");
    stack.setAttribute("aria-label", total
      ? stats.filter(s => s.score > 0).map(s => `${s.cat.name} ${Math.round(s.score / total * 100)}%`).join(", ")
      : "아직 양수 취향 점수가 없어요");
    stats.filter(s => s.score > 0).forEach(s => {
      const segment = el("span");
      segment.style.width = `${s.score / total * 100}%`;
      segment.style.backgroundColor = color(s.cat.color);
      stack.append(segment);
    });
    const legend = el("ul", "fx-legend");
    stats.filter(s => s.read || s.score).forEach(s => {
      const item = el("li");
      const dot = el("span", "fx-dot");
      dot.style.backgroundColor = color(s.cat.color);
      dot.setAttribute("aria-hidden", "true");
      item.append(dot, el("span", "", `${s.cat.name} · ${s.read}화 · ${s.score}점`));
      legend.append(item);
    });
    node.append(stack, legend, el("p", "fx-description",
      "읽은 화 +1점, 좋아요 +6점, 별로예요 −6점. 막대는 분야별 양수 점수의 비율이에요."));
    if (!total) node.append(el("p", "fx-description", "책을 읽거나 좋아요를 남기면 취향이 나타나요."));
    const untried = stats.filter(s => !s.read && BOOKS.some(b => String(b.category) === s.id))
      .sort((a, b) => seed(today() + a.id) - seed(today() + b.id));
    if (untried.length) {
      const s = untried[0];
      node.append(el("p", "fx-description", "이런 분야도 읽어 보세요"),
        button(`${s.cat.icon || "📚"} ${s.cat.name} 서가`, () => go("#/shelf/" + s.id)));
    }
  }

  function drawInvitation(b) {
    const canvas = el("canvas");
    canvas.width = 1080;
    canvas.height = 1350;
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", `${b.title} 책 초대장`);
    const ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("canvas");
    const gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
    gradient.addColorStop(0, color(CATS[b.category]?.color));
    gradient.addColorStop(1, `hsl(${hue(String(b.id))} 45% 18%)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1080, 1350);
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.fillRect(0, 0, 1080, 1350);
    ctx.fillStyle = "rgba(255,255,255,.12)";
    ctx.fillRect(32, 0, 8, 1350);
    ctx.fillStyle = "#fff";
    const text = (value, y, size, lines, weight = 500) => {
      ctx.font = `${weight} ${size}px system-ui, "Malgun Gothic", sans-serif`;
      const chars = Array.from(String(value || "").replace(/\s+/g, " ").trim());
      let index = 0;
      for (let line = 0; line < lines && index < chars.length; line++) {
        let row = "";
        while (index < chars.length && ctx.measureText(row + chars[index]).width <= 920)
          row += chars[index++];
        if (line === lines - 1 && index < chars.length) {
          while (row && ctx.measureText(row + "…").width > 920) row = Array.from(row).slice(0, -1).join("");
          row += "…";
        }
        ctx.fillText(row, 80, y + line * size * 1.4);
      }
    };
    text("영훈즈 서점 · 당신을 위한 책 초대장", 100, 30, 1);
    text(CATS[b.category]?.name || "함께 읽는 책", 157, 27, 1);
    ctx.font = '150px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
    ctx.fillText(b.emoji || "📚", 80, 350);
    text(b.title, 480, 68, 3, 800);
    text(b.subtitle, 780, 36, 2, 600);
    text(b.blurb, 930, 32, 5);
    text(`${Number(b.chapters) || 0}화 ${b.done ? "완결" : "연재 중"}`, 1225, 34, 1, 700);
    text("이 책, 우리 같이 읽어요.", 1290, 27, 1);
    return canvas;
  }

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = el("a");
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function invitation(b) {
    modalClose?.();
    const previousFocus = document.activeElement;
    const dialog = el("dialog", "fx-dialog");
    dialog.setAttribute("aria-labelledby", `${PREFIX}-invite-title`);
    const heading = el("h2", "fx-heading", "친구에게 보내는 책 초대장");
    heading.id = `${PREFIX}-invite-title`;
    const canvas = drawInvitation(b);
    const actions = el("div", "fx-actions");
    const url = location.origin + location.pathname + "#/book/" + b.id;
    let imageUrl = "";
    const cleanup = () => {
      if (imageUrl) URL.revokeObjectURL(imageUrl);
      dialog.remove();
      if (modalClose === close) modalClose = null;
      if (previousFocus?.isConnected) previousFocus.focus();
    };
    const close = () => { dialog.close(); };
    modalClose = close;
    dialog.addEventListener("close", cleanup, { once: true });
    dialog.addEventListener("click", e => {
      if (e.target !== dialog) return;
      const r = dialog.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) close();
    });
    const save = el("a", "fx-button fx-link", "PNG 준비 중");
    save.setAttribute("aria-label", "초대장 PNG 저장");
    save.setAttribute("aria-disabled", "true");
    actions.append(save);
    if (typeof navigator.share === "function") {
      actions.append(button("공유하기", async () => {
        try { await navigator.share({ title: b.title, text: "이 책, 우리 같이 읽어요.", url }); }
        catch (error) { if (error.name !== "AbortError") tell("공유하지 못했어요. 링크 복사를 이용해 주세요."); }
      }));
    }
    actions.append(button("링크 복사", async () => {
      try {
        if (!navigator.clipboard?.writeText) throw new Error("clipboard");
        await navigator.clipboard.writeText(url);
        tell("책 링크를 복사했어요.");
      } catch (_) {
        let input = dialog.querySelector(".fx-url");
        if (!input) {
          input = el("input", "fx-url");
          input.readOnly = true;
          input.value = url;
          input.setAttribute("aria-label", "직접 복사할 책 링크");
          dialog.append(input);
        }
        input.focus();
        input.select();
        tell("선택된 링크를 길게 눌러 복사해 주세요.");
      }
    }), button("닫기", close));
    dialog.append(heading, canvas, actions);
    document.body.append(dialog);
    try { dialog.showModal(); } catch (error) { cleanup(); throw error; }
    canvas.toBlob(blob => {
      if (!dialog.isConnected) return;
      if (!blob) { save.textContent = "PNG 생성 실패"; return; }
      imageUrl = URL.createObjectURL(blob);
      save.href = imageUrl;
      save.download = "yeonghoon-invitation.png";
      save.textContent = "PNG 저장";
      save.removeAttribute("aria-disabled");
    }, "image/png");
  }

  function validateValue(key, value) {
    const object = v => v !== null && typeof v === "object" && !Array.isArray(v);
    if (key === "yh_prog") return object(value) && Object.values(value).every(p =>
      object(p) && Number.isInteger(p.n) && p.n >= 1 &&
      Array.isArray(p.read) && p.read.every(n => Number.isInteger(n) && n > 0) &&
      Number.isFinite(p.t));
    if (key === "yh_favs") return Array.isArray(value) && value.every(id => typeof id === "string");
    if (key === "yh_rate") return object(value) && Object.values(value).every(r =>
      object(r) && [-1, 0, 1].includes(r.v) && Number.isFinite(r.ts));
    if (key === "yh_pref") return object(value) && Number.isFinite(value.size) &&
      value.size >= 14 && value.size <= 28 && ["light", "sepia", "dark"].includes(value.th) &&
      ["light", "dark"].includes(value.ui);
    if (key === "yh_reqs") return Array.isArray(value) && value.every(r =>
      object(r) && ["id", "text", "cat", "len"].every(k => typeof r[k] === "string") &&
      Number.isFinite(r.ts));
    return true;
  }

  function backup(wrap) {
    const node = section(wrap, `${PREFIX}-backup`, "내 기록 백업·복원");
    const actions = el("div", "fx-actions");
    actions.append(button("내보내기", () => {
      // 전체 키 목록과 원문 열람만 localStorage를 사용하고, 복원은 store로 저장한다.
      const entries = Object.keys(localStorage).filter(key => key.startsWith("yh_"))
        .map(key => [key, localStorage.getItem(key)]);
      for (const [, raw] of entries) {
        if (typeof raw !== "string") throw new Error("storage");
        JSON.parse(raw);
      }
      const payload = { format: "yeonghoon-backup", version: 1, date: today(), entries };
      download(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }),
        `yeonghoon-backup-${today()}.json`);
    }));
    const input = el("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.hidden = true;
    input.setAttribute("aria-label", "복원할 기록 JSON 파일");
    const importButton = button("가져오기", () => input.click());
    input.addEventListener("change", safe(async () => {
      const file = input.files?.[0];
      input.value = "";
      if (!file) return;
      let entries;
      try {
        if (file.size > 10 * 1024 * 1024) throw new Error("size");
        const data = JSON.parse(await file.text());
        if (data?.format !== "yeonghoon-backup" || data.version !== 1 ||
          !Array.isArray(data.entries) || !data.entries.length || data.entries.length > 5000)
          throw new Error("format");
        const seen = new Set();
        entries = data.entries.map(pair => {
          if (!Array.isArray(pair) || pair.length !== 2) throw new Error("entry");
          const [key, raw] = pair;
          if (typeof key !== "string" || !key.startsWith("yh_") || key.length <= 3 ||
            key.length > 256 || seen.has(key) || typeof raw !== "string") throw new Error("key");
          seen.add(key);
          const value = JSON.parse(raw);
          if (!validateValue(key, value)) throw new Error("value");
          return [key.slice(3), value];
        });
      } catch (_) {
        tell("올바른 영훈즈 백업 JSON 파일이 아니거나 파일이 너무 커요.");
        return;
      }
      if (!window.confirm(`${entries.length}개 기록을 가져올까요?\n같은 키의 현재 기록은 덮어쓰고, 나머지 기록은 유지해요.\n먼저 내보내기로 현재 기록을 보관하는 것을 권장해요.`)) return;
      importButton.disabled = true;
      try {
        for (const [key, value] of entries) {
          store.set(key, value);
          const sentinel = {};
          if (JSON.stringify(store.get(key, sentinel)) !== JSON.stringify(value))
            throw new Error("write");
        }
        location.reload();
      } catch (_) {
        tell("저장 공간 또는 접근 제한으로 복원을 마치지 못했어요. 일부 기록이 반영됐을 수 있어요.");
      } finally {
        importButton.disabled = false;
      }
    }));
    actions.append(importButton);
    node.append(el("p", "fx-description", "이 기기의 서점 기록 전체를 파일로 보관해요. 가져오기는 같은 기록을 덮어써요."),
      actions, input);
  }

  F.reg("home", safe(() => {
    modalClose?.();
    const wrap = document.querySelector("#app .wrap");
    if (wrap) renderMood(wrap);
  }));
  F.reg("mine", safe(() => {
    modalClose?.();
    const wrap = document.querySelector("#app .wrap");
    if (!wrap) return;
    [constellation, spectrum, backup].forEach(fn => safe(fn)(wrap));
  }));
  F.reg("book", safe(b => {
    modalClose?.();
    if (!b) return;
    const wrap = document.querySelector("#app .wrap");
    if (!wrap) return;
    const node = section(wrap, `${PREFIX}-invite`, "책 초대장");
    node.append(button("친구에게 초대장 보내기", () => invitation(b)));
    const anchor = wrap.querySelector(".act");
    if (anchor) anchor.after(node);
  }));
  document.addEventListener("visibilitychange", safe(() => {
    if (document.hidden) return;
    const node = document.getElementById(`${PREFIX}-mood`);
    if (!dailyMood()) clearAccent();
    if (node?.parentElement) renderMood(node.parentElement);
  }));
  window.addEventListener("hashchange", safe(() => modalClose?.()));
})();

}catch(e){console.warn('feature load', e)}})();

</script>
<script>window.__boot();</script>
</body>
</html>
