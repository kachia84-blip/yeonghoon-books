<html lang="ko">
<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1c22;--sub:#6c6a75;--line:#ebe7e0;--accent:#e8613c;--shadow:0 2px 10px rgba(30,25,20,.08)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;word-break:keep-all}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}

.top .sp{flex:1}
.top .btn{font-size:20px;padding:4px 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h2.sec{font-size:17px;font-weight:800;margin:24px 0 10px;display:flex;align-items:baseline;justify-content:space-between}

.fold{margin-left:8px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line,#8884);background:transparent;color:inherit;font-size:18px;line-height:1;cursor:pointer}

.hero{margin:16px 0 4px;border-radius:18px;padding:20px;color:#fff;background:linear-gradient(135deg,#e8613c,#b5389a);box-shadow:var(--shadow)}

.row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.book{flex:0 0 118px;scroll-snap-align:start;text-align:left}
.cover{aspect-ratio:2/3;border-radius:6px 10px 10px 6px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;box-shadow:var(--shadow),inset 5px 0 6px -3px rgba(0,0,0,.28)}
.cover .em{font-size:30px;line-height:1}.cover .tt{font-size:13px;font-weight:800;line-height:1.28;text-shadow:0 1px 3px rgba(0,0,0,.35)}

.cover>*{position:relative;z-index:1}.cover>.pat{position:absolute;inset:0;z-index:0}
.cover .pat.p0{background:radial-gradient(rgba(255,255,255,.2) 2px,transparent 2.6px) 0 0/14px 14px}
.cover .pat.p1{background:repeating-linear-gradient(45deg,rgba(255,255,255,.13) 0 7px,transparent 7px 17px)}
.cover .pat.p2{background:radial-gradient(circle at 78% 24%,rgba(255,255,255,.24) 0 32%,transparent 33%)}
.cover .pat.p3{background:linear-gradient(180deg,transparent 52%,rgba(0,0,0,.28) 52% 68%,transparent 68%)}
.cover .pat.p4{background:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px) 0 0/16px 16px}
.cover .pat.p5{background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.3) 48%)}
.cover .pat.p6{background:repeating-radial-gradient(circle at 18% 88%,rgba(255,255,255,.16) 0 3px,transparent 3px 14px)}
.cover .pat.p7{background:radial-gradient(circle at 50% 108%,rgba(255,255,255,.26) 0 46%,transparent 47%)}
.cover.fr .pat::after{content:"";position:absolute;inset:5px 5px 5px 9px;border:1px solid rgba(255,255,255,.4);border-radius:3px;pointer-events:none;z-index:1}
.cover.sf .tt{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:900}
.cover.l1{flex-direction:column-reverse}.cover.l1 .em{align-self:flex-end}
.cover.l2{justify-content:center;gap:10px;text-align:center}.cover.l2 .cat{position:absolute;top:10px;left:0;right:0}.cover.l2 .em{font-size:38px}
.cover.l3 .em{font-size:48px;align-self:flex-end;margin-top:4px}.cover.l3 .tt{font-size:14px}
.cover .seen{position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}.cont .cover .seen{display:none}
.cover .new{position:absolute;top:8px;right:8px;background:#fff;color:var(--accent);font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
.book .nm{font-size:13px;font-weight:700;margin:8px 0 2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .mt{font-size:11px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;margin-top:10px}
.grid .book{flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.cont{padding:8px 12px;margin:8px 0}.cont{display:flex;gap:12px;align-items:center}.cont .cover{flex:0 0 36px;width:36px;height:52px;min-height:0;aspect-ratio:auto;padding:4px;border-radius:3px 5px 5px 3px}.cont .cover .pat{display:none}.cont .cover .em{font-size:16px}.cont .cover .tt,.cont .cover .cat{display:none}

.cont .x{flex:none;width:28px;height:28px;background:transparent;color:var(--sub);font-size:16px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}.tab button span{font-size:20px}.tab button.on{color:var(--accent);font-weight:700}
.detail{display:flex;gap:16px;margin:18px 0}.detail .cover{flex:0 0 120px}.detail .tx h2{margin:0 0 4px;font-size:21px;line-height:1.25}.detail .tx p{margin:0 0 6px;color:var(--sub);font-size:14px}
.blurb{font-size:15px;line-height:1.65;color:var(--ink);margin:6px 0 14px}
.act{display:flex;gap:10px;margin:12px 0}.act button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card)}.act .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.toc{list-style:none;margin:0;padding:0}.toc li{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.toc .n{flex:0 0 28px;font-weight:800;color:var(--accent);font-size:14px}.toc .t{flex:1;font-size:15px;line-height:1.35}.toc .d{font-size:11px;color:var(--sub)}
.toc li.lock{opacity:.45;cursor:default}.toc li.read{opacity:.55;background:color-mix(in srgb,var(--sub) 10%,transparent)}.toc li.read .t,.toc li.read .n{color:var(--sub)}.toc li.read .d{font-weight:700}
.toc li.part .t,.toc li.part .n,.toc li.part .d{color:#2f6fed;font-weight:800}[data-ui=dark] .toc li.part .t,[data-ui=dark] .toc li.part .n,[data-ui=dark] .toc li.part .d{color:#6ea2ff}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:18px 0;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;line-height:1.7}
/* reader */
.reader{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.reader[data-th=light]{--rbg:#fffefb;--rink:#25232a;--rsub:#88858f}

.reader{background:var(--rbg);color:var(--rink)}

.rbar button{padding:6px 10px;font-size:15px;border-radius:8px;color:var(--rink)}
.rbody{max-width:640px;margin:0 auto;padding:26px 22px 60px}
.rbody .ch{font-size:12px;color:var(--rsub);letter-spacing:.5px}.rbody h1{font-size:1.45em;line-height:1.35;margin:6px 0 22px}
.rbody h3{font-size:1.15em;margin:2em 0 .6em;line-height:1.4}.rbody p{line-height:1.95;margin:0 0 1.15em;font-size:1em;white-space:pre-wrap}

.rnav2{margin-top:10px}.rnav2 button{font-weight:600;font-size:14px}

.panel{position:fixed;right:10px;top:calc(56px + env(safe-area-inset-top));z-index:25;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);width:230px}

.inst{display:flex;gap:12px;align-items:center;margin:14px 0 0;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}

.inst .go{background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;font-size:13px;flex:none}.inst .x{color:var(--sub);font-size:18px;padding:4px;flex:none}
.search{width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.pick{display:flex;gap:14px;align-items:center;margin-top:10px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer}
.pick .cover{flex:0 0 84px}.pick .i{flex:1;min-width:0}.pick .why{font-size:11px;color:var(--accent);font-weight:700}.pick h3{margin:3px 0 4px;font-size:16px;line-height:1.3}.pick p{margin:0;font-size:12px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why2{font-size:11px;color:var(--accent);margin-top:2px}
.nw{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px;font-size:18px}.modal ol{margin:0 0 16px;padding-left:20px;line-height:1.9;font-size:15px}.modal button{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
:root[data-ui=dark]{--bg:#141414;--card:#1f1f1f;--line:#2b2b2b;--accent:#e5484d;--sub:#a3a3a3}
.top.nf{position:fixed;left:0;right:0;border:0;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff}
.top.nf h1{color:#fff}.top.nf h1 b{color:#e5484d}
.nhero{touch-action:pan-y;position:relative;margin:0 -16px;height:min(74vh,600px);min-height:440px;overflow:hidden;color:#fff;cursor:pointer}
.nhero .bgc{position:absolute;inset:0;transition:opacity .5s}
.nhero .big{position:absolute;right:-10px;top:12%;font-size:210px;line-height:1;opacity:.92;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}

.nhero .bt{display:flex;gap:10px}.nhero .bt button{padding:11px 22px;border-radius:8px;font-weight:800;font-size:15px}

.rank{flex:0 0 150px;display:flex;align-items:flex-end;scroll-snap-align:start;cursor:pointer}

.rank .cover{width:104px;flex:none}
.nfwrap h2.sec{font-size:18px;margin:22px 0 10px}

.srow{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px;margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--line)}

.wish .em{font-size:30px}.wish b{display:block;font-size:15px}.wish span{font-size:12px;color:var(--sub)}.wish .go{margin-left:auto;font-weight:800;color:var(--accent);font-size:13px;white-space:nowrap}

<body>
<div id="app"></div>

const GROUPS = [

  {id: "prac", name: "실용", cats: ["selfhelp", "money", "labor"]},

  {id: "wish", name: "희망도서", cats: ["wish"]}

const FIC_RE = /소설|웹소설|괴담|공포|미스터리|스릴러|추리|판타지|무협|로맨스|SF|회귀|환생|빙의|단편/, PRAC_RE = /건강|운동|요리|음식|식단|재테크|투자|부동산|육아|여행|취미|생활|다이어트|수면|법|노동|자기계발|습관|공부|글쓰기|영어/;
function groupOf(cid){
  const g = GROUPS.find(x => x.cats && x.cats.includes(cid)); if (g) return g.id;
  const c = CATS[cid] || {};
  if (["fic", "prac", "hum", "wish"].includes(c.group)) return c.group;      // 분야에 지정된 묶음이 최우선
  if (String(cid).startsWith("wn-")) return "fic";                       // 웹소설 하위 분야(판타지·무협·회귀·재테크물·단편)는 모두 소설
  if (FIC_RE.test(c.name || "")) return "fic";
  if (PRAC_RE.test(c.name || "")) return "prac";
  return "hum";                                                            // 그 밖의 새 분야(심리·과학·역사 등)는 교양·인문

function setRate(id, v){

let crate = store.get("crate", {});          // 책id -> {화번호: 1|-1}  (화별 평가, 합계가 책 평가에 반영된다)
const chapRateOf = (id, n) => ((crate[id] || {})[n]) || 0;
function setChapRate(id, n, v){
  const nv = chapRateOf(id, n) === v ? 0 : v, m = {...(crate[id] || {})};

  crate = {...crate, [id]: m}; store.set("crate", crate);
  const sum = Object.values(m).reduce((a, x) => a + x, 0);
  rate[id] = {v: Math.sign(sum), ts: Math.floor(Date.now() / 1000), sent: 0}; store.set("rate", rate); publishRate(id);
  document.querySelectorAll(`.rate[data-id="${id}"][data-n="${n}"]`).forEach(el => el.outerHTML = rateHtml(BOOKS.find(b => b.id === id), true, n));

/* ---- 추천 ---- */
const seed = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
function catWeights(){
  const w = {};
  for (const [id, p] of Object.entries(prog)){ const b = BOOKS.find(x => x.id === id); if (b) w[b.category] = (w[b.category] || 0) + (p.read || []).length; }
  for (const id of favs){ const b = BOOKS.find(x => x.id === id); if (b) w[b.category] = (w[b.category] || 0) + 4; }
  for (const [cid, v] of Object.entries(DATA.boost || {})) w[cid] = (w[cid] || 0) + v * 2;
  for (const [id, r] of Object.entries(rate)){ const b = BOOKS.find(x => x.id === id); if (b && r.v) w[b.category] = (w[b.category] || 0) + 6 * r.v; }
  return w;
}
function todayPick(){
  const pool = BOOKS.filter(b => !disliked(b) && !(prog[b.id] && (prog[b.id].read || []).length));
  if (!pool.length) return null;
  const b = pool.map(x => [seed(DATA.today + x.id), x]).sort((a, c) => a[0] - c[0])[0][1];
  return {id: b.id, b, why: `${CATS[b.category].icon} ${CATS[b.category].name} · 오늘 이 책부터 시작해 보세요`};
}
function recommend(){
  const w = catWeights(), top = Object.entries(w).sort((a, b) => b[1] - a[1]);
  const pk = todayPick();

    });
    let longest = 0, streak = 0, previous = null;
    days.map(([day]) => Date.parse(`${day}T00:00:00Z`)).sort((a, b) => a - b).forEach(day => {
      streak = previous !== null && day - previous === 86400000 ? streak + 1 : 1;
      longest = Math.max(longest, streak);
      previous = day;
    });
    const cat = [...categories].sort((a, b) => b[1] - a[1])[0];
    const category = cat ? CATS[cat[0]] : null;
    return [
      {title: `${y} 나의 독서 결산`, value: days.length ? days.reduce((sum, [, n]) => sum + num(n), 0) : total, unit: "화",
        note: `${stats.length ? "올해 기록된" : "누적"} ${fmt(stats.length ? stats.reduce((sum, [, s]) => sum + num(s?.chars), 0) : chars)}자 · ${days.length ? "올해 날짜별 기록 기준" : "날짜별 기록이 없어 읽은 화는 누적 기준"}`},
      {title: "책과 함께한 시간", value: stats.length ? Math.floor(stats.reduce((sum, [, s]) => sum + num(s?.sec), 0) / 60) : "기록 없음",
        unit: stats.length ? "분" : "", note: `${y}년 fy_stats에 저장된 독서 시간`},
      {title: "가장 많이 읽은 분야", value: category ? `${category.icon || "📚"} ${category.name}` : "아직 없어요",
        unit: "", note: "책별 독서 날짜가 없어 누적 읽은 화 기준"},
      {title: "가장 긴 연속 읽기", value: longest, unit: "일", note: `${y}년 날짜별 읽기 기록 기준`},
      {title: "가장 많이 읽은 책", value: best?.b.title || "첫 책을 기다려요", unit: "",
        note: best ? `누적 ${fmt(best.count)}화 · 책별 독서 날짜는 제공되지 않아요` : "책을 읽으면 이곳에 기록돼요"},
      {title: "내 마음에 남은 책", value: books().filter(b => rating(b.id) === 1).length, unit: "권",
        note: "현재 좋아요한 책 · 이 기기에 저장된 기록으로 만들었어요"}
    ];
  }

  function exportCard(slides) {
    const canvas = document.createElement("canvas");
    canvas.width = 1080; canvas.height = 1920;
    const ctx = canvas.getContext("2d");
    if (!ctx) return toast("이미지를 만들 수 없어요");
    const gradient = ctx.createLinearGradient(0, 0, 1080, 1920);
    gradient.addColorStop(0, "#252252"); gradient.addColorStop(.55, "#713a85"); gradient.addColorStop(1, "#c64f65");
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, 1080, 1920); ctx.fillStyle = "#fff";
    ctx.font = "bold 58px sans-serif"; ctx.fillText(`${year()} 나의 독서 결산`, 80, 130);
    function lines(text, y, size, maxLines) {
      ctx.font = `${size >= 40 ? "bold " : ""}${size}px sans-serif`;
      const rows = []; let line = "";
      for (const char of String(text)) {
        if (ctx.measureText(line + char).width > 920 && line) { rows.push(line); line = char; }
        else line += char;
      }
      if (line) rows.push(line);
      rows.slice(0, maxLines).forEach((value, i) => {
        if (i === maxLines - 1 && rows.length > maxLines) {
          while (value && ctx.measureText(`${value}…`).width > 920) value = value.slice(0, -1);
          value += "…";
        }
        ctx.fillText(value, 80, y + i * size * 1.35);
      });
    }
    slides.forEach((slide, i) => {
      const y = 240 + i * 255;
      lines(slide.title, y, 30, 1);
      lines(`${typeof slide.value === "number" ? fmt(slide.value) : slide.value}${slide.unit}`, y + 66, 48, 2);
      lines(slide.note, y + 160, 23, 2);
    });
    lines("원의 서재 · 나만의 독서 기록", 1860, 27, 1);
    canvas.toBlob(safe(blob => {
      if (!blob) return toast("이미지 저장에 실패했어요");
      const url = URL.createObjectURL(blob), link = el("a");
      link.href = url; link.download = `원의서재-독서결산-${year()}.png`;
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }), "image/png");
  }

  function wrapped() {
    const slides = summary(), m = modal(`${year()} 독서 결산`, true);
    const top = el("div", "fz-flex"), dots = el("div", "fz-dots");
    top.append(dots, btn("✕", m.close, "", "독서 결산 닫기"));
    const body = el("div", "fz-slide"), footer = el("div", "fz-storyfooter");
    body.tabIndex = 0;
    body.setAttribute("role", "button");
    m.box.append(top, body, footer);
    let index = 0, frame = 0;
    function draw() {
      cancelAnimationFrame(frame);
      const slide = slides[index];
      dots.replaceChildren();
      slides.forEach((_, i) => {
        const dot = btn("", () => { index = i; draw(); }, "", `${i + 1}번째 결산 보기`);
        dot.className = "fz-dot";
        dot.setAttribute("aria-current", String(index === i));
        dots.append(dot);
      });
      body.replaceChildren(el("h2", "", slide.title));
      body.setAttribute("aria-label", `${slide.title}. ${slide.value}${slide.unit}. ${slide.note}. 탭하면 다음 장`);
      const number = el("div", "fz-number"), note = el("p", "fz-storynote", slide.note);
      body.append(number, note);
      const target = slide.value;
      number.textContent = `${typeof target === "number" ? fmt(target) : target}${slide.unit}`;
      if (typeof target === "number" && target > 0 && !reduced()) {
        const started = performance.now();
        const animate = now => {
          if (!body.isConnected || reduced()) { number.textContent = `${fmt(target)}${slide.unit}`; return; }
          const progress = Math.min(1, (now - started) / 650);
          number.textContent = `${fmt(target * (1 - (1 - progress) ** 3))}${slide.unit}`;
          if (progress < 1) frame = requestAnimationFrame(animate);
        };
        frame = requestAnimationFrame(animate);
      }
      footer.replaceChildren();
      if (index) footer.append(btn("이전", () => { index--; draw(); }));
      if (index < slides.length - 1) footer.append(btn("다음", next));
      else footer.append(btn("이미지로 저장", () => exportCard(slides)), btn("닫기", m.close));
    }
    function next() { if (index < slides.length - 1) { index++; draw(); } }
    on(body, "click", next);
    on(body, "keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); next(); }
    });
    draw();
  }

  F.reg("mine", safe(() => {
    const parent = wrap();
    if (!parent || parent.querySelector("#fz-mine")) return;
    const node = section("mine", "나의 독서");
    node.append(btn("📊 나의 독서 결산 보기", wrapped, "fz-primary"));
    const challenge = el("div", "fz-box"), y = String(year());
    const saved = object(get("challenge", {}));
    const goal = Math.min(50, Math.max(1, Math.round(num(saved[y]) || 5)));
    const finished = books().filter(complete), label = el("label", "fz-flex", `${y}년 목표 권수`);
    const input = el("input", "fz-input");
    input.type = "number"; input.min = "1"; input.max = "50"; input.step = "1"; input.value = String(goal);
    input.setAttribute("aria-label", `${y}년 목표 권수, 1권부터 50권`);
    label.append(input);
    const text = el("p"), progress = el("progress", "fz-progress");
    progress.setAttribute("aria-label", "독서 챌린지 완독 진행률");
    function update() {
      const target = Math.min(50, Math.max(1, Math.round(num(input.value) || 5)));
      input.value = String(target);
      put("challenge", {...object(get("challenge", {})), [y]: target});
      text.textContent = `올해 ${target}권 중 ${finished.length}권 완독`;
      progress.max = target; progress.value = Math.min(target, finished.length);
      progress.setAttribute("aria-valuetext", `${target}권 목표, ${finished.length}권 완독`);
    }
    on(input, "change", update);
    update();
    challenge.append(el("h3", "", "연간 독서 챌린지"), label, text, progress);
    challenge.append(el("p", "fz-muted", "목표는 연도별로 저장돼요. 기존 기록에 완독 날짜가 없어 완독 권수와 표지는 누적 기록 기준이에요."));
    if (finished.length) challenge.append(row(finished));
    node.append(challenge);
    parent.append(node);
    renderCollections(parent);
  }));

  on(window, "hashchange", () => {
    activeModal?.close();
    clearTimeout(searchTimer);
  });
})();

}catch(e){console.warn('feature load', e)}});

</script>
<script>
(async function(){
  try{
    if (!window.__safe){
      const c = new AbortController(), tm = setTimeout(() => c.abort(), 1200);
      const r = await fetch("flags.json?t=" + Math.floor(Date.now() / 60000), {signal: c.signal, cache: "no-store"});
      clearTimeout(tm);
      if (r.ok){ const f = await r.json(); if (f.safe) window.__safe = true; if (f.lowfx) pref.lowfx = true; }
    }
  }catch(e){}
  if (!window.__safe) window.__featQueue.forEach(fn => { try{ fn(); }catch(e){ console.warn(e); } });
  window.__featQueue = [];
  if (window.__safe){
    const bar = document.createElement("div");
    bar.style.cssText = "position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:55;margin:0 12px;padding:10px 14px;border-radius:12px;background:#2b2b2b;color:#fff;font-size:12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.35)";
    bar.innerHTML = '<span style="flex:1">🛟 안전 모드 — 추가 기능이 꺼져 있어요</span><button style="background:#e5484d;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700" onclick="setSafe(false)">해제</button>';
    document.body.appendChild(bar);
  }
  window.__boot();
})();
</script>
